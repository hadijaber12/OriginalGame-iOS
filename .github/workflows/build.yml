name: Build Unity iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix IPA Structure for Sideloadly
        run: |
          unzip OriginalGame.zip -d extracted
          mkdir -p Payload
          # البحث عن ملف الـ .app ونقله وسمّيه OriginalGame.app ليتطابق مع طلب Sideloadly
          APP_PATH=$(find extracted -name "*.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/OriginalGame.app
          else
            cp -R extracted/* Payload/
          fi
          zip -r OriginalGame.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OriginalGame-IPA
          path: OriginalGame.ipa
