name: Build Unity iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Proper IPA Structure
        run: |
          unzip OriginalGame.zip -d extracted
          mkdir -p Payload
          # البحث عن ملف .app الناتج من يونيتي ونقله مباشرة داخل Payload
          find extracted -name "*.app" -exec cp -R {} Payload/ \;
          zip -r OriginalGame.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OriginalGame-IPA
          path: OriginalGame.ipa
