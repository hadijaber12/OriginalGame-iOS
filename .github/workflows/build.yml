name: Build Unity iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Perfect IPA
        run: |
          unzip OriginalGame.zip -d extracted
          mkdir -p Payload
          # نسخ محتويات المشروع المضروب أو ملفات البناء مباشرة داخل مجلد Payload
          cp -R extracted/* Payload/
          # التأكد من عدم وجود تداخل في المجلدات
          if [ -d "Payload/Payload" ]; then
            mv Payload/Payload/* Payload/
            rmdir Payload/Payload
          fi
          zip -r OriginalGame.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OriginalGame-IPA
          path: OriginalGame.ipa
